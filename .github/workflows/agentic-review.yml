# SPDX-License-Identifier: MIT
#
# Production agentic review. Two parallel, least-privilege jobs run Codex agents
# over the PR diff and reach GitHub only through deterministic scripts:
#   - pr-reviewer posts findings, reconciles prior threads, and sets the
#     per-commit agentic-review/clean status.
#   - escalation judge sets the sticky needs-human label.
# Neither agent can approve or merge; only the separate gate workflow approves.
# Untrusted PR text (title, body) is passed via env, never interpolated into a
# run script, to avoid script injection.
#
# Both jobs run their agent through openai/codex-action (pinned): it installs
# Codex, holds the API key in a local proxy the agent process never sees, and
# drops sudo before running. The pr-reviewer additionally fetches its prior
# threads first and renders a reconcile brief, then executes the agent's
# verdicts. The escalation judge runs only when needs-human is not already set
# (see the preflight job). A later shared-harness extraction (architecture
# section 7) will dedupe the common prepare steps across repos.
---
name: Agentic Review

"on":
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: agentic-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_REF: ${{ github.base_ref }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_TITLE: ${{ github.event.pull_request.title }}
  PR_BODY: ${{ github.event.pull_request.body }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CODEX_EFFORT: xhigh

jobs:
  pr-reviewer:
    name: pr-reviewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check model key
        id: key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; agentic review skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Codex runs the agent's shell tools under a workspace-write sandbox that
      # needs bubblewrap on Linux. Without it every command the agent runs,
      # including the git diff it reads the change from, fails and the agent
      # reviews blind from PR metadata. Install it so the agent sees the diff.
      - name: Install Codex sandbox deps (bubblewrap)
        if: steps.key.outputs.present == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # ubuntu-24.04 ships kernel.apparmor_restrict_unprivileged_userns=1,
          # which blocks the unprivileged user namespace bubblewrap needs, so
          # Codex's workspace-write sandbox fails to initialize and the agent
          # cannot run the git diff it reviews from. Relax it for this runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install central LFX skills (best effort)
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: |
          git clone --depth=1 https://github.com/linuxfoundation/lfx-skills "$RUNNER_TEMP/lfx-skills"
          "$RUNNER_TEMP/lfx-skills/install.sh"

      # Review against the merge-base (the state of the base when the PR
      # branched), not the current base tip, so changes made on the base since
      # then do not pollute the diff. Matches agents/simulate/simulate.sh.
      - name: Compute merge base
        id: mb
        if: steps.key.outputs.present == 'true'
        run: |
          if ! git fetch --no-tags origin "$BASE_REF"; then
            echo "::warning::could not fetch base ref $BASE_REF; falling back to base.sha"
          fi
          MB="$(git merge-base FETCH_HEAD "$HEAD_SHA" 2>/dev/null || true)"
          if [ -z "$MB" ]; then
            echo "::warning::merge-base via base ref failed; using base.sha"
            MB="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          fi
          echo "merge_base=$MB" >> "$GITHUB_OUTPUT"

      # Fetch the pr-reviewer's prior threads and summary BEFORE the agent runs,
      # so the brief can ask it to reconcile them and post-comments can execute
      # its verdicts. Read-only; fails closed on a fetch error.
      - name: Fetch prior review state
        if: steps.key.outputs.present == 'true'
        env:
          STATE_FILE: ${{ runner.temp }}/state.json
        run: ./.github/scripts/agentic/fetch-state.sh

      - name: Render brief
        if: steps.key.outputs.present == 'true'
        env:
          BASE_SHA: ${{ steps.mb.outputs.merge_base }}
          STATE_FILE: ${{ runner.temp }}/state.json
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.txt"
          PR_BODY_FILE="$RUNNER_TEMP/body.txt" \
            ./.github/scripts/agentic/render-brief.sh > "$RUNNER_TEMP/brief.md"

      - name: Run pr-reviewer (Codex)
        if: steps.key.outputs.present == 'true'
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1 # v1.8
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: agents/pr-reviewer
          prompt-file: ${{ runner.temp }}/brief.md
          output-file: ${{ runner.temp }}/findings.json
          model: gpt-5.5
          effort: ${{ env.CODEX_EFFORT }}
          sandbox: workspace-write

      - name: Post comments and reconcile threads
        id: review
        if: steps.key.outputs.present == 'true'
        env:
          FINDINGS: ${{ runner.temp }}/findings.json
          STATE_FILE: ${{ runner.temp }}/state.json
        run: ./.github/scripts/agentic/post-comments.sh

      - name: Publish agentic-review/clean status
        if: steps.key.outputs.present == 'true'
        run: |
          if [ "${{ steps.review.outputs.clean }}" = "true" ]; then
            STATE=success; DESC="No blocking issues remain."
          else
            STATE=failure; DESC="Blocking issues remain; resolve the review threads with fixes."
          fi
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context=agentic-review/clean \
            -f description="$DESC"

  # needs-human is sticky and human-owned. Once set, re-running the escalation
  # judge wastes a Codex call and risks a duplicate comment, so gate the whole
  # job behind this preflight. Fails open (run) on a label read error, since a
  # missed escalation is worse than one extra run.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      escalate: ${{ steps.decide.outputs.escalate }}
    steps:
      - name: Decide whether to run the escalation judge
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not configured; escalation judge skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "escalate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
                  --jq 'any(.labels[].name; . == "needs-human")' 2>/dev/null || echo unknown)"
          if [ "$has" = "true" ]; then
            echo "needs-human already set; escalation judge skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "escalate=false" >> "$GITHUB_OUTPUT"
          else
            echo "escalate=true" >> "$GITHUB_OUTPUT"
          fi

  escalation:
    name: escalation-judge
    needs: preflight
    if: needs.preflight.outputs.escalate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check model key
        id: key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; escalation judge skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Codex runs the agent's shell tools under a workspace-write sandbox that
      # needs bubblewrap on Linux. Without it every command the agent runs,
      # including the git diff it reads the change from, fails and the agent
      # reviews blind from PR metadata. Install it so the agent sees the diff.
      - name: Install Codex sandbox deps (bubblewrap)
        if: steps.key.outputs.present == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # ubuntu-24.04 ships kernel.apparmor_restrict_unprivileged_userns=1,
          # which blocks the unprivileged user namespace bubblewrap needs, so
          # Codex's workspace-write sandbox fails to initialize and the agent
          # cannot run the git diff it reviews from. Relax it for this runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install central LFX skills (best effort)
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: |
          git clone --depth=1 https://github.com/linuxfoundation/lfx-skills "$RUNNER_TEMP/lfx-skills"
          "$RUNNER_TEMP/lfx-skills/install.sh"

      - name: Compute merge base
        id: mb
        if: steps.key.outputs.present == 'true'
        run: |
          if ! git fetch --no-tags origin "$BASE_REF"; then
            echo "::warning::could not fetch base ref $BASE_REF; falling back to base.sha"
          fi
          MB="$(git merge-base FETCH_HEAD "$HEAD_SHA" 2>/dev/null || true)"
          if [ -z "$MB" ]; then
            echo "::warning::merge-base via base ref failed; using base.sha"
            MB="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          fi
          echo "merge_base=$MB" >> "$GITHUB_OUTPUT"

      - name: Render brief
        if: steps.key.outputs.present == 'true'
        env:
          BASE_SHA: ${{ steps.mb.outputs.merge_base }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.txt"
          PR_BODY_FILE="$RUNNER_TEMP/body.txt" \
            ./.github/scripts/agentic/render-brief.sh > "$RUNNER_TEMP/brief.md"

      - name: Run escalation judge (Codex)
        if: steps.key.outputs.present == 'true'
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1 # v1.8
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: agents/escalation-reviewer
          prompt-file: ${{ runner.temp }}/brief.md
          output-file: ${{ runner.temp }}/escalation.json
          model: gpt-5.5
          effort: ${{ env.CODEX_EFFORT }}
          sandbox: workspace-write

      - name: Apply needs-human verdict
        if: steps.key.outputs.present == 'true'
        env:
          VERDICT: ${{ runner.temp }}/escalation.json
        run: ./.github/scripts/agentic/apply-verdict.sh
